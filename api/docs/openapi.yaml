openapi: 3.0.3
info:
  title: Financial System API
  version: 1.0.0
  description: API REST para criacao de contas, processamento de operacoes financeiras e consulta de historico.
servers:
  - url: http://localhost:8080
tags:
  - name: Health
  - name: Accounts
  - name: Clients
  - name: Operations
paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check da aplicacao
      description: Verifica se a API esta respondendo e se a conexao com o banco esta disponivel.
      operationId: getHealth
      responses:
        "200":
          description: Aplicacao saudavel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Aplicacao indisponivel ou banco inacessivel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/accounts/create:
    post:
      tags:
        - Accounts
      summary: Cria uma nova conta
      description: Cria um cliente quando CPF/email ainda nao existem e cria uma nova conta BRL ativa com limite padrao.
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountRequest"
            examples:
              create:
                value:
                  name: Maria Silva
                  email: maria@example.com
                  cpf: "12345678901"
      responses:
        "200":
          description: Conta criada com sucesso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAccountSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/accounts/{id}:
    get:
      tags:
        - Accounts
      summary: Busca uma conta por ID
      operationId: getAccountById
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Conta encontrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetAccountSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/clients/{id}:
    get:
      tags:
        - Clients
      summary: Busca um cliente por ID
      operationId: getClientById
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Cliente encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetClientSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/operations/{type}:
    post:
      tags:
        - Operations
      summary: Processa uma operacao financeira
      description: Processa credit, debit, reserve, capture, transfer ou reversal. A API gera o reference_id automaticamente e o devolve na resposta.
      operationId: createOperation
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [credit, debit, reserve, capture, transfer, reversal]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperationRequest"
            examples:
              credit:
                value:
                  account_id: 1
                  value: 100000
                  currency: BRL
              transfer:
                value:
                  account_id: 1
                  account_dest_id: 2
                  value: 50000
                  currency: BRL
              reversal:
                value:
                  original_reference_id: 2d266f9f-01f8-44b0-a5ed-7f5da1a18d0c
      responses:
        "200":
          description: Operacao processada com sucesso.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/OperationSuccess"
                  - $ref: "#/components/schemas/TransferSuccess"
                  - $ref: "#/components/schemas/ReversalSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/operations/{id}:
    get:
      tags:
        - Operations
      summary: Busca historico de operacao por ID
      operationId: getOperationHistoryById
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Historico encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetOperationHistorySuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: uint64
        minimum: 1
  responses:
    BadRequest:
      description: Requisicao invalida.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflito de dados ou reference_id ja processado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Recurso nao encontrado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnprocessableEntity:
      description: Regra de negocio violada.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Erro interno.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      required: [message, errorCode]
      properties:
        message:
          type: string
        errorCode:
          type: integer
    HealthResponse:
      type: object
      required: [status, timestamp, checks]
      properties:
        status:
          type: string
          enum: [ok, unhealthy]
        timestamp:
          type: string
          format: date-time
        checks:
          type: object
          additionalProperties:
            type: string
          example:
            api: ok
            database: ok
    CreateAccountRequest:
      type: object
      required: [name, email, cpf]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
        email:
          type: string
          format: email
        cpf:
          type: string
          description: CPF com 11 digitos. Pontos e hifen sao aceitos e normalizados.
          example: "12345678901"
    OperationRequest:
      type: object
      properties:
        account_id:
          type: integer
          format: uint64
          minimum: 1
        account_dest_id:
          type: integer
          format: uint64
          minimum: 1
        original_reference_id:
          type: string
          description: Obrigatorio para reversal.
        value:
          type: integer
          format: int64
          minimum: 1
          description: Valor em centavos.
        currency:
          type: string
          minLength: 3
          maxLength: 3
          example: BRL
    SuccessEnvelope:
      type: object
      required: [message]
      properties:
        message:
          type: string
    CreateAccountSuccess:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            account:
              type: array
              items:
                type: object
                properties:
                  account_id:
                    type: integer
                    format: uint64
                  client_id:
                    type: integer
                    format: uint64
                  status:
                    type: string
                  currency:
                    type: string
                  type:
                    type: string
                    enum: [existing, new]
    Account:
      type: object
      properties:
        ID:
          type: integer
          format: uint64
        ClientID:
          type: integer
          format: uint64
        AvailableBalance:
          type: integer
          format: int64
        ReservedBalance:
          type: integer
          format: int64
        CreditLimit:
          type: integer
          format: int64
        Currency:
          type: string
        Status:
          type: string
          enum: [active, inactive, blocked]
        Version:
          type: integer
        CreatedAt:
          type: string
          format: date-time
        UpdatedAt:
          type: string
          format: date-time
    Client:
      type: object
      properties:
        ID:
          type: integer
          format: uint64
        Name:
          type: string
        Email:
          type: string
        CPF:
          type: string
        Status:
          type: string
          enum: [active, closed]
        Accounts:
          type: array
          items:
            $ref: "#/components/schemas/Account"
        CreatedAt:
          type: string
          format: date-time
        UpdatedAt:
          type: string
          format: date-time
    GetAccountSuccess:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            account:
              $ref: "#/components/schemas/Account"
    GetClientSuccess:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            client:
              $ref: "#/components/schemas/Client"
    OperationData:
      type: object
      properties:
        transaction_id:
          type: string
        reference_id:
          type: string
          description: Identificador gerado pela API para idempotencia e estorno.
        status:
          type: string
          enum: [success, failed, pending]
        balance:
          type: integer
          format: int64
        reserved_balance:
          type: integer
          format: int64
        available_balance:
          type: integer
          format: int64
        credit_used:
          type: integer
          format: int64
        credit_available:
          type: integer
          format: int64
        timestamp:
          type: string
          format: date-time
        error_message:
          type: string
          nullable: true
        type:
          type: string
    OperationSuccess:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/OperationData"
    TransferData:
      type: object
      properties:
        transaction_id:
          type: string
        reference_id:
          type: string
          description: Identificador gerado pela API para idempotencia e estorno.
        status:
          type: string
        type:
          type: string
        origin_account_id:
          type: integer
          format: uint64
        dest_account_id:
          type: integer
          format: uint64
        origin_balance:
          type: integer
          format: int64
        dest_balance:
          type: integer
          format: int64
        credit_used:
          type: integer
          format: int64
        credit_available:
          type: integer
          format: int64
        timestamp:
          type: string
          format: date-time
        error_message:
          type: string
          nullable: true
        debit_tx_id:
          type: integer
          format: uint64
        credit_tx_id:
          type: integer
          format: uint64
        transfer_group_id:
          type: string
          nullable: true
    TransferSuccess:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/TransferData"
    ReversalAccountResult:
      type: object
      properties:
        account_id:
          type: integer
          format: uint64
        balance:
          type: integer
          format: int64
        available_balance:
          type: integer
          format: int64
        reserved_balance:
          type: integer
          format: int64
    ReversalData:
      type: object
      properties:
        transaction_id:
          type: string
        reference_id:
          type: string
          description: Identificador gerado pela API para idempotencia.
        status:
          type: string
        type:
          type: string
        timestamp:
          type: string
          format: date-time
        error_message:
          type: string
          nullable: true
        original_reference_id:
          type: string
        reversal_tx_ids:
          type: array
          items:
            type: integer
            format: uint64
        transfer_group_id:
          type: string
          nullable: true
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/ReversalAccountResult"
    ReversalSuccess:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ReversalData"
    OperationHistory:
      type: object
      properties:
        id:
          type: integer
          format: uint64
        account_id:
          type: integer
          format: uint64
        reference_id:
          type: string
        transfer_group_id:
          type: string
          nullable: true
        related_tx_id:
          type: integer
          format: uint64
          nullable: true
        type:
          type: string
          enum: [credit, debit, reserve, capture, reversal, transfer]
        direction:
          type: string
          enum: [debit, credit]
          nullable: true
        value:
          type: integer
          format: int64
        currency:
          type: string
        status:
          type: string
          enum: [success, failed, pending]
        error_message:
          type: string
          nullable: true
        metadata:
          type: object
          nullable: true
        created_at:
          type: string
          format: date-time
    GetOperationHistorySuccess:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            history:
              $ref: "#/components/schemas/OperationHistory"
